name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Linux)
    runs-on: [self-hosted, proj-odin, linux, odin]
    steps:
      - name: Checkout (plain git)
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          case "$SERVER" in
            http://*)  AUTH_URL="http://oauth2:${GH_TOKEN}@${SERVER#http://}/$REPO" ;;
            https://*) AUTH_URL="https://oauth2:${GH_TOKEN}@${SERVER#https://}/$REPO" ;;
            *)         AUTH_URL="$SERVER/$REPO" ;;
          esac
          git init -q .
          git remote add origin "$AUTH_URL"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          echo "checked out: $(git log --oneline -1)"

      - name: Toolchain
        run: |
          odin version
          pkg-config --modversion libstrophe || true

      - name: Build
        run: ./scripts/build.sh

      - name: Test
        run: ./scripts/test.sh
